const VOCAB=RAW.split("\n").map((l,i)=>{const[e0,d]=l.split("|");let e=e0.trim(),pos;const de=d.split("/").map(s=>s.trim());if(e[0]==="~"){e=e.slice(1);pos="adverb"}else if(/^to /.test(e))pos="verb";else if(/^(der|die|das)\s/i.test(de[0]))pos="noun";else pos="adjective";return{id:i+1,en:e,de,pos}});
const byId=id=>VOCAB.find(w=>w.id===id);

/* ============ 2. SPEECH (STT + TTS) ============ */
const Speech={
  SR:window.SpeechRecognition||window.webkitSpeechRecognition,
  supported(){return !!this.SR},
  rec:null,
  listen(onInterim){
    return new Promise(res=>{
      const r=new this.SR();this.rec=r;r.lang="de-DE";r.interimResults=true;r.maxAlternatives=5;r.continuous=false;
      let out=null,err=null,started=false;
      r.onresult=e=>{const rs=e.results[e.results.length-1];
        const alts=[...rs].map(a=>({t:a.transcript.trim(),c:a.confidence||0}));
        if(rs.isFinal)out=alts;else onInterim&&onInterim(alts[0].t)};
      r.onerror=e=>{err=e.error};r.onstart=()=>{started=true};
      r.onend=()=>{this.rec=null;res({alts:out||[],error:err})};
      try{r.start()}catch(e){res({alts:[],error:"start-failed"})}
      setTimeout(()=>{if(!started){try{r.abort()}catch(e){}res({alts:[],error:"no-start"})}},6000);
    });
  },
  stop(){try{this.rec&&this.rec.stop()}catch(e){}},
  speak(text){
    try{const u=new SpeechSynthesisUtterance(text);u.lang="de-DE";u.rate=.85;
      const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith("de"));if(v)u.voice=v;
      speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
  }
};

/* ============ 3. ANSWER EVALUATION (local fuzzy + AI) ============ */
const Evaluator={
  ai:null,
  async init(){try{this.ai=await claude.use("sample")}catch(e){this.ai=null}},
  norm(s){return s.toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
    .replace(/[^a-z\s]/g,"").replace(/\b(der|die|das|ein|eine|den|dem)\b/g,"").replace(/\s+/g," ").trim()},
  lev(a,b){const m=[...Array(a.length+1)].map((_,i)=>[i]);for(let j=1;j<=b.length;j++)m[0][j]=j;
    for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
      m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]},
  sim(a,b){if(!a||!b)return 0;return 1-this.lev(a,b)/Math.max(a.length,b.length)},
  local(alts,word){
    let best=0;
    for(const a of alts){const h=this.norm(a.t);const parts=[h,...h.split(" ")];
      for(const t of word.de){const n=this.norm(t);for(const p of parts)best=Math.max(best,this.sim(p,n))}}
    return best;
  },
  artCheck(alts,word){
    if(!word.de.some(d=>/^(der|die|das)\s/i.test(d)))return null;
    const tk=s=>s.toLowerCase().replace(/[^a-zäöüß\s]/g,"").trim().split(/\s+/);
    let nounOk=false;
    for(const a of alts){const t=tk(a.t),hasA=["der","die","das"].includes(t[0]),ha=hasA?t[0]:null,hn=this.norm((hasA?t.slice(1):t).join(" "));
      for(const d of word.de){const e=tk(d),ea=e[0],en=this.norm(e.slice(1).join(" "));
        if(this.sim(hn,en)>=0.8){nounOk=true;if(ha===ea)return "correct"}}}
    return nounOk?"incorrect":null;
  },
  /* returns "correct" | "incorrect" | "unclear" */
  async evaluate(alts,word){
    if(!alts.length||!alts[0].t)return "unclear";
    {const ac=this.artCheck(alts,word);if(ac)return ac}
    const s=this.local(alts,word);
    if(s>=0.8)return "correct";
    if(this.ai){
      try{
        const r=await Promise.race([this.ai.json(
`You grade spoken German vocabulary. Speech recognition (de-DE) heard these candidates from a learner with a non-native accent: ${JSON.stringify(alts.map(a=>a.t))}.
English prompt: "${word.en}". Accepted German: ${JSON.stringify(word.de)}.
For nouns the accepted answers include the article (der/die/das): a missing or wrong article makes the answer incorrect. Accept if any candidate is a correct German translation of the prompt (including valid synonyms, missing/added article, or a clear speech-recognition mishearing of an accepted word). Reject if it is a different word. Use "unclear" only if the candidates look like noise or are too garbled to judge.
Reply with JSON only: {"verdict":"correct"|"incorrect"|"unclear"}`),
          new Promise((_,j)=>setTimeout(()=>j("timeout"),9000))]);
        if(r&&["correct","incorrect","unclear"].includes(r.verdict))return r.verdict;
      }catch(e){}
    }
    if(s>=0.65)return "unclear";
    return "incorrect";
  }
};

/* ============ 4. SESSION MANAGEMENT ============ */
const Session={
  KEY:"dvt-session-v3",S:null,
  order(){let a=VOCAB.map(w=>w.id),s=20261108;const r=()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296};for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},
  batch(){let p=0;try{p=+localStorage.getItem("dvt-ptr")||0}catch(e){}const o=this.order(),out=[];for(let i=0;i<50;i++)out.push(o[(p*50+i)%o.length]);return out},
  fresh(){const q=this.batch().sort(()=>Math.random()-.5);
    return{round:1,day:new Date().toDateString(),total:q.length,queue:q,rev:[],first:{},mastered:[],reveal:false,done:false}},
  load(){try{const s=JSON.parse(localStorage.getItem(this.KEY));if(s&&s.queue&&!(s.done&&s.day!==new Date().toDateString()))return s}catch(e){}return this.fresh()},
  save(){try{if(this.S.done&&!this.S.counted){this.S.counted=true;localStorage.setItem("dvt-ptr",String((+localStorage.getItem("dvt-ptr")||0)+1))}localStorage.setItem(this.KEY,JSON.stringify(this.S))}catch(e){}},
  init(){this.S=this.load()},
  reset(){this.S=this.fresh();this.save()},
  get cur(){return this.S.queue[0]},
  correct(){const s=this.S,id=s.queue.shift();
    if(s.round===1)s.first[id]=true;
    if(!s.mastered.includes(id))s.mastered.push(id);
    s.reveal=false;this.advance()},
  wrong(){const s=this.S,id=s.queue.shift();
    if(s.round===1){s.first[id]=false;s.rev.push(id);this.advance()}
    else{s.queue.push(id)}  /* show answer now, keep it in the queue */
    this.save()},
  finishReveal(){const s=this.S,id=s.queue.shift();s.queue.push(id);s.reveal=false;this.advance()},
  advance(){const s=this.S;
    if(s.round===1&&!s.queue.length){if(s.rev.length){s.round=2;s.queue=s.rev.slice();s.rev=[]}else s.done=true}
    else if(s.round===2&&!s.queue.length)s.done=true;
    this.save()},
  stats(){const s=this.S,t=s.total||VOCAB.length,m=s.mastered.length,needRev=Object.values(s.first).filter(v=>!v).length;
    return{total:t,mastered:m,remaining:t-m,wrong:Object.entries(s.first).filter(([id,v])=>!v&&!s.mastered.includes(+id)).length,needRev}}
};

/* ============ 5. UI ============ */
const $=s=>document.querySelector(s);
let forceType=false,busy=false,listening=false,unclear=0,msg="",sub="",cardCls="";
const app=$("#app");

function render(){
  const S=Session.S,st=Session.stats();
  if(S.done){
    app.innerHTML=`<div class="done"><div class="big">🎉</div><h2>Today's 50 mastered!</h2><div class="round">Come back tomorrow for your next 50</div>
    <div class="sum"><div>Total words practised<b>${st.total}</b></div>
    <div>Correct on first try<b>${st.total-st.needRev}</b></div>
    <div>Needed revision<b>${st.needRev}</b></div>
    <div>Mastered now<b>${st.mastered} / ${st.total}</b></div></div>
    <button class="btn mic" style="flex:none;width:260px" id="again">Practise 50 more now</button></div>`;
    $("#again").onclick=()=>{Session.reset();msg="";render()};return;
  }
  const w=byId(Session.cur),rev=S.round===2;
  const pct=st.mastered/st.total*100;
  const body=S.reveal?`<div class="sub">${w.en}</div><div class="de">${w.de[0]}</div><div class="sub">🔊 Say it out loud</div>`
    :cardCls==="bad"||cardCls==="ok"?`<div class="sub">${w.en}</div><div class="de">${w.de[0]}</div><div class="sub">🔊</div>`:`<div class="pos">${w.pos}</div><div class="w">${w.en}</div><div class="sub">${sub}</div>`;
  app.innerHTML=`
  <div class="top"><button class="x" id="x" aria-label="Exit">✕</button><div class="bar"><div class="fill" style="width:${pct}%"></div></div>
  <div class="cnt"><i>✓</i>${st.mastered}</div></div>
  <h1>${rev?"Second look":"Say it in German"}</h1>
  <div class="round ${rev?"rev":""}">${rev?"Round 2 · Revision":"Round 1 · Learning"}</div>
  <div class="stage"><div class="card ${cardCls} ${S.reveal?"reveal":""}" id="card">${body}</div></div>
  <div class="msg" id="msg">${msg}</div>
  <div class="stats"><span>Total <b>${st.total}</b></span><span>Correct <b>${st.mastered}</b></span><span>Incorrect <b>${st.wrong}</b></span><span>Left <b>${st.remaining}</b></span></div>
  <div class="ctrl"><button class="btn mic ${listening?"on":""}" id="mic">${listening?'<span class="dots"><span></span><span></span><span></span></span> Listening':"🎤 Speak German"}</button>
  <button class="btn skip" id="skip" aria-label="Skip">⏭</button></div>
  <div class="typed" id="typed"><input id="ti" placeholder="Or type the German word" lang="de" enterkeyhint="send" autocomplete="off"></div>`;
  $("#mic").onclick=onMic;$("#skip").onclick=onSkip;
  $("#x").onclick=()=>{if(confirm("Exit and restart the session?")){Session.reset();msg="";cardCls="";sub="";render()}};
  if(true){$("#typed").style.display="block";
    $("#ti").onkeydown=e=>{if(e.key==="Enter"&&e.target.value.trim())handle([{t:e.target.value.trim(),c:1}])};
    }
  if(S.reveal)Speech.speak(w.de[0]);
  
}

async function onMic(){
  if(busy)return;
  
  if(listening){Speech.stop();return}
  if(!Speech.supported()){msg="Speech recognition isn't supported in this browser. Try Chrome or Safari.";return render()}
  try{const ms=await navigator.mediaDevices.getUserMedia({audio:true});ms.getTracks().forEach(t=>t.stop())}catch(e){msg="Mic request failed ("+(e&&e.name||e)+"). The page may be blocked from the mic by the site hosting it.";return render()}
  listening=true;sub="";msg="Say the German word…";render();
  const r=await Speech.listen(t=>{const el=$(".card .sub");if(el)el.textContent="“"+t+"”"});
  listening=false;
  if(r.error==="not-allowed"||r.error==="service-not-allowed"){msg="Microphone blocked. Allow mic access for this page (try opening it in its own tab), then tap again.";return render()}
  if(r.error==="no-start"||r.error==="start-failed"){forceType=true;msg="The microphone didn't start ("+r.error+"). Open this page in its own browser tab (Chrome/Safari) and allow the mic. You can type meanwhile.";return render()}
  if(r.error==="network"){msg="Speech service unreachable. Check your connection and try again.";return render()}
  if(r.error&&r.error!=="no-speech"&&r.error!=="aborted"){msg="Speech error: "+r.error+". Tap the mic to retry.";return render()}
  handle(r.alts);
}

async function handle(alts){
  busy=true;const w=byId(Session.cur),S=Session.S;
  sub=alts[0]?"“"+alts[0].t+"”":"";msg="Checking…";render();
  const verdict=await Evaluator.evaluate(alts,w);
  if(verdict==="unclear"&&unclear<2){unclear++;busy=false;msg="I couldn't quite catch that — tap the mic and say it again.";return render()}
  unclear=0;
  const ok=verdict==="correct";
  if(S.reveal){ /* repeat-after-me step */
    cardCls="ok";msg=ok?"Nice! Well repeated.":"Keep practising — it will come back.";render();
    setTimeout(()=>{cardCls="";sub="";msg="";Session.finishReveal();busy=false;render()},1300);return;
  }
  if(ok){cardCls="ok";msg="Richtig! ✓";sub="";Speech.speak(w.de[0]);render();
    setTimeout(()=>{cardCls="";sub="";msg="";Session.correct();busy=false;render()},1700);}
  else{cardCls="bad";sub="→ "+w.de[0];Speech.speak(w.de[0]);msg=Session.S.round===1?"Not quite — we'll revisit this one.":"Not yet — here's the answer.";render();
    setTimeout(()=>{cardCls="";sub="";msg="";Session.wrong();busy=false;render()},3000);}
}

function onSkip(){
  if(busy||listening)return;busy=true;const S=Session.S;
  if(S.reveal){Session.finishReveal()}else{Session.wrong()}
  unclear=0;sub="";msg="";cardCls="";busy=false;render();
}

(async()=>{Session.init();render();await Evaluator.init();
  try{speechSynthesis.getVoices()}catch(e){}})();
</script></body></html>
